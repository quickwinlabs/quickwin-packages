name: publish

on:
  push:
    branches: [main]
    paths: ['packages/**']
  workflow_dispatch:

# one publish at a time; never cancel an in-flight publish
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # emsdk is big (~hundreds of MB); mupdf-wasm's build.sh clones it to
      # /tmp/emsdk when absent (version pinned in that script). Cache it so a
      # rebuild only pays the mupdf compile cost. Drop this step once no
      # package builds with emscripten.
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: /tmp/emsdk
          key: emsdk-4.0.8

      # Every package is self-contained: its own package.json version, its own
      # `npm run build` recipe (artifacts are never committed, each package's
      # .gitignore lists them). The loop only builds a package whose exact
      # version is missing from the registry, so bumping one package never
      # rebuilds the others.
      #
      # Per package: build → npm publish.
      - name: Build and publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured yet — skipping publish"
            exit 0
          fi

          failed=""
          # 发布按依赖拓扑：被依赖的包先发布。字母序会把 tray-list（t）排在 uia（u）
          # 前，而 tray-list 依赖 @quickwinlabs/uia——uia 未发布时 npm install 404。
          sorted=$(node -e '
            const fs = require("fs");
            const dirs = fs.readdirSync("packages")
              .filter(d => fs.existsSync(`packages/${d}/package.json`));
            const pkgs = dirs.map(d => ({ d, p: JSON.parse(fs.readFileSync(`packages/${d}/package.json`)) }));
            const names = new Set(pkgs.map(x => x.p.name));
            const deps = new Map(pkgs.map(x => [x.p.name,
              Object.keys({ ...x.p.peerDependencies, ...x.p.dependencies, ...x.p.devDependencies } || {})
                .filter(n => names.has(n))]));
            const order = []; const done = new Set();
            while (order.length < pkgs.length) {
              const next = pkgs
                .filter(x => !done.has(x.p.name) && deps.get(x.p.name).every(d => done.has(d)))
                .sort((a, b) => a.d.localeCompare(b.d))[0];
              if (!next) break;
              order.push(next.d); done.add(next.p.name);
            }
            console.log(order.map(d => `packages/${d}/package.json`).join(" "));
          ')
          for pkgjson in $sorted; do
            [ -e "$pkgjson" ] || continue
            dir=$(dirname "$pkgjson")
            name=$(node -p "require('./$pkgjson').name")
            version=$(node -p "require('./$pkgjson').version")

            live=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ "$live" = "$version" ]; then
              echo "skip $name@$version — already on npm"
              continue
            fi

            echo "::group::$name@$version"
            # Run the build in a plain subshell and read $? afterwards: inside
            # `if ( ... )` or `( ... ) || ...` bash puts the subshell in a
            # condition context and silently ignores `set -e`, so a failed
            # build would fall through to publish.
            (
              set -euo pipefail
              cd "$dir"

              # Optional per-package dependency install (uia/tsc style builds).
              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund
              elif node -e "const p=require('./package.json');process.exit(p.dependencies||p.devDependencies?0:1)"; then
                npm install --no-audit --no-fund
              fi

              node -e "const p=require('./package.json');if(!p.scripts?.build)throw new Error('package.json has no scripts.build')"
              npm run build
              npm publish --access public
            )
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "published $name@$version"
            else
              echo "::error::$name@$version failed (rc=$rc)"
              failed="$failed $name@$version"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
